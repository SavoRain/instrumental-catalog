<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SavorRain | Instrumental Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">SAVORRAIN</div>
        <p class="subtitle">Custom Instrumentals & Leases — DM or Buy Direct</p>
    </header>

    <main class="catalog-container">
        <table class="beat-table">
            <thead>
                <tr>
                    <th>Beat Name</th>
                    <th>Audio Preview</th>
                    <th>Key</th>
                    <th>BPM</th>
                    <th>Genre</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- BEAT ROW 1 -->
                <tr>
                    <td class="beat-title">Midnight Run</td>
                    <td>
                        <audio controls preload="none">
                            <source src="audio/midnight-run-tagged.mp3" type="audio/mpeg">
                            Your browser does not support the audio element.
                        </audio>
                    </td>
                    <td>C# Min</td>
                    <td>140</td>
                    <td>Trap</td>
                    <td><span class="status available">Available</span></td>
                    <td><a href="YOUR_PAYPAL_LINK_HERE" target="_blank" class="buy-btn">Buy License</a></td>
                </tr>

                <!-- BEAT ROW 2 (Example of an exclusive sold beat) -->
                <tr>
                    <td class="beat-title">Ethereal Vibe</td>
                    <td>
                        <audio controls preload="none">
                            <source src="audio/ethereal-vibe-tagged.mp3" type="audio/mpeg">
                            Your browser does not support the audio element.
                        </audio>
                    </td>
                    <td>F Maj</td>
                    <td>125</td>
                    <td>R&B</td>
                    <td><span class="status sold">Exclusive Sold</span></td>
                    <td><span class="sold-text">Sold Out</span></td>
                </tr>
            </tbody>
        </table>
    </main>

    <footer>
        <p>&copy; 2026 SavorRain. All rights reserved. Master rights retained by producer.</p>
    </footer>

</body>
</html>
